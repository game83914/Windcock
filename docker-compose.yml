version: '3.8'

services:
  db:
    image: postgres:16
    container_name: windcock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: windcock
      POSTGRES_PASSWORD: windcock
      POSTGRES_DB: windcock
    ports:
      - '5432:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: windcock-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  dbdata:
